name: بناء APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "وسم llama.cpp المستخدم في البناء (مثل b5000)"
        required: false
        default: "b5000"

permissions:
  contents: write

env:
  LLAMA_REF: ${{ github.event.inputs.llama_ref || 'b5000' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد هيكل أندرويد
        run: flutter create --org com.dirgham --project-name dirgham_code --platforms android app

      - name: جلب llama.cpp
        run: |
          git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git app/android/app/src/main/cpp/llama.cpp
          rm -rf app/android/app/src/main/cpp/llama.cpp/.git

      - name: دمج مصدر ضرغام كود
        run: python3 tools/apply_overlay.py app

      - name: تثبيت الاعتماديات
        working-directory: app
        run: flutter pub get

      - name: بناء APK (arm64)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: حفظ الـ APK كملف مرفق
        uses: actions/upload-artifact@v4
        with:
          name: dirgham-code-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر الـ APK في صفحة Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ضرغام كود - بناء ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
