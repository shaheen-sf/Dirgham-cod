
name: بناء تطبيق ضرغام كود APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      llama_ref:
        description: "نسخة llama.cpp"
        required: false
        default: "b11500"

permissions:
  contents: write

concurrency:
  group: dirgham-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تحديد مصدر المشروع
        shell: bash
        run: |
          set -euo pipefail

          PROJ=""

          # البحث عن ملفات المشروع المرفوعة مباشرة
          S=$(find . -type f -name apply_overlay.py \
            -not -path './.git/*' | head -n 1 || true)

          if [ -n "$S" ]; then
            PROJ=$(cd "$(dirname "$S")/.." && pwd)
          else
            # البحث عن الملف المضغوط
            Z=$(find . -maxdepth 4 -type f \
              -iname '*.zip' | head -n 1 || true)

            if [ -z "$Z" ]; then
              echo "::error::لم يتم العثور على ملف المشروع ZIP"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/source"
            unzip -q -o "$Z" -d "$RUNNER_TEMP/source"

            S=$(find "$RUNNER_TEMP/source" \
              -type f -name apply_overlay.py | head -n 1 || true)

            if [ -n "$S" ]; then
              PROJ=$(cd "$(dirname "$S")/.." && pwd)
            fi
          fi

          if [ -z "$PROJ" ] || \
             [ ! -f "$PROJ/app_src/pubspec.yaml" ]; then
            echo "::error::بنية المشروع غير مكتملة"
            exit 1
          fi

          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "تم العثور على المشروع: $PROJ"

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز Android SDK
        shell: bash
        run: |
          yes | flutter doctor --android-licenses \
            >/dev/null 2>&1 || true

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: إنشاء مشروع Android
        run: |
          flutter create \
            --org com.dirgham \
            --project-name dirgham_code \
            --platforms android \
            "$RUNNER_TEMP/gen"

      - name: تحميل llama.cpp
        env:
          LLAMA_REF: ${{ github.event.inputs.llama_ref || 'b11500' }}
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/gen/android/app/src/main/cpp/llama.cpp"

          mkdir -p "$(dirname "$DEST")"

          git clone \
            --depth 1 \
            --branch "$LLAMA_REF" \
            https://github.com/ggml-org/llama.cpp.git \
            "$DEST"

          git -C "$DEST" log -1 --format='llama.cpp: %H'

          rm -rf "$DEST/.git"

      - name: دمج ملفات ضرغام كود
        run: |
          python3 "$PROJ/tools/apply_overlay.py" \
            "$RUNNER_TEMP/gen"

      - name: تثبيت مكتبات Flutter
        working-directory: ${{ runner.temp }}/gen
        run: flutter pub get

      - name: فحص Flutter
        working-directory: ${{ runner.temp }}/gen
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: بناء APK Release
        working-directory: ${{ runner.temp }}/gen
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: رفع APK إلى Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dirgham-code-apk
          path: ${{ runner.temp }}/gen/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: نشر APK في Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: ضرغام كود - بناء ${{ github.run_number }}
          files: ${{ runner.temp }}/gen/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

      - name: رفع سجل الأخطاء
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dirgham-build-error-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/gen/build/reports/
          if-no-files-found: ignore
