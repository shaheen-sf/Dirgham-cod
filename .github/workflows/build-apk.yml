name: بناء APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "وسم llama.cpp (الافتراضي b11500)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: تحديد مكان مصدر ضرغام كود
        run: |
          set -e
          echo "== محتوى المستودع =="; ls -A
          PROJ=""
          S=$(find . -type f -name apply_overlay.py -path '*tools*' -not -path './app/*' | head -n1 || true)
          if [ -n "$S" ]; then
            PROJ=$(cd "$(dirname "$S")/.." && pwd)
          else
            Z=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n1 || true)
            if [ -n "$Z" ]; then
              echo "فك الضغط: $Z"
              mkdir -p "$RUNNER_TEMP/unz"
              unzip -q -o "$Z" -d "$RUNNER_TEMP/unz"
              S=$(find "$RUNNER_TEMP/unz" -type f -name apply_overlay.py | head -n1 || true)
              [ -n "$S" ] && PROJ=$(cd "$(dirname "$S")/.." && pwd)
            fi
          fi
          if [ -z "$PROJ" ] || [ ! -f "$PROJ/app_src/pubspec.yaml" ]; then
            echo "::error::لم أجد tools/apply_overlay.py و app_src. ارفع محتويات الـ zip (أو الـ zip نفسه) إلى المستودع."
            exit 1
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "مصدر المشروع: $PROJ"; ls -A "$PROJ"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز أدوات أندرويد
        run: |
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: توليد هيكل أندرويد
        run: flutter create --org com.dirgham --project-name dirgham_code --platforms android "$RUNNER_TEMP/gen"

      - name: جلب llama.cpp
        env:
          LLAMA_REF: ${{ github.event.inputs.llama_ref || 'b11500' }}
        run: |
          set -e
          D="$RUNNER_TEMP/gen/android/app/src/main/cpp/llama.cpp"
          URL=https://github.com/ggml-org/llama.cpp.git
          mkdir -p "$(dirname "$D")"
          if ! git clone --depth 1 --branch "$LLAMA_REF" "$URL" "$D"; then
            echo "::warning::تعذّر جلب الوسم $LLAMA_REF، سأجلب أحدث نسخة"
            rm -rf "$D"
            git clone --depth 1 "$URL" "$D"
          fi
          git -C "$D" log -1 --format='llama.cpp commit: %H %cd'
          rm -rf "$D/.git"
          # توحيد الطوابع الزمنية كي لا يرى ninja ملفًا "أحدث" من build.ninja
          find "$D" -exec touch -h -d "2020-01-01 00:00:00" {} +

      - name: فحص واجهة llama.cpp
        run: |
          H="$RUNNER_TEMP/gen/android/app/src/main/cpp/llama.cpp/include/llama.h"
          for f in llama_backend_init llama_model_load_from_file llama_model_free llama_model_get_vocab \
                   llama_tokenize llama_init_from_model llama_free llama_decode llama_batch_get_one \
                   llama_sampler_chain_init llama_sampler_init_top_k llama_sampler_init_top_p \
                   llama_sampler_init_temp llama_sampler_init_dist llama_sampler_sample \
                   llama_vocab_is_eog llama_token_to_piece llama_model_chat_template llama_chat_apply_template llama_print_system_info; do
            if grep -q "$f" "$H"; then echo "موجودة  $f"; else echo "::warning::مفقودة في llama.h: $f"; fi
          done

      - name: دمج مصدر ضرغام كود
        run: |
          python3 "$PROJ/tools/apply_overlay.py" "$RUNNER_TEMP/gen"
          grep -n "SUPPRESS_REGENERATION" "$RUNNER_TEMP/gen/android/app/src/main/cpp/CMakeLists.txt"

      - name: تثبيت الاعتماديات
        working-directory: ${{ runner.temp }}/gen
        run: flutter pub get

      - name: بناء APK (arm64)
        working-directory: ${{ runner.temp }}/gen
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: رفع سجل البناء عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: حفظ الـ APK كملف مرفق
        uses: actions/upload-artifact@v4
        with:
          name: dirgham-code-apk
          path: ${{ runner.temp }}/gen/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر الـ APK في صفحة Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ضرغام كود - بناء ${{ github.run_number }}
          files: ${{ runner.temp }}/gen/build/app/outputs/flutter-apk/app-release.apk
