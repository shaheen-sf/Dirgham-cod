name: بناء APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "وسم llama.cpp (اتركه فارغًا لجلب أحدث نسخة)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد هيكل أندرويد
        run: flutter create --org com.dirgham --project-name dirgham_code --platforms android app

      - name: جلب llama.cpp
        env:
          LLAMA_REF: ${{ github.event.inputs.llama_ref }}
        run: |
          D=app/android/app/src/main/cpp/llama.cpp
          URL=https://github.com/ggml-org/llama.cpp.git
          if [ -n "$LLAMA_REF" ]; then
            git clone --depth 1 --branch "$LLAMA_REF" "$URL" "$D" \
              || git clone --depth 1 "$URL" "$D"
          else
            git clone --depth 1 "$URL" "$D"
          fi
          git -C "$D" log -1 --format='llama.cpp commit: %H %cd'
          rm -rf "$D/.git"

      - name: دمج مصدر ضرغام كود
        run: python3 tools/apply_overlay.py app

      - name: تثبيت الاعتماديات
        working-directory: app
        run: flutter pub get

      - name: بناء APK (arm64)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: حفظ الـ APK كملف مرفق
        uses: actions/upload-artifact@v4
        with:
          name: dirgham-code-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر الـ APK في صفحة Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ضرغام كود - بناء ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
